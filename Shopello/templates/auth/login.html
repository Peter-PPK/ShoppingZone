{% load static %}
{% load widget_tweaks %}
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Zone</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" crossorigin="anonymous"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body id="loginBody">
    <div class="background">
        <span></span><span></span><span></span> <!-- etc -->
    </div>

    <div class="card mx-auto login-box my-5" style="width:500px; position:relative; z-index:10;">
        <h5 class="card-header text-white" style="background-color: #800517">Login</h5>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group my-2">
                    <label for="username"><strong>Username:</strong></label>
                    {% render_field form.username type="text" class="form-control" id="exampleInputUsername" %}
                </div>
                <div class="form-group my-2">
                    <label for="password"><strong>Password:</strong></label>
                    {% render_field form.password type="password" class="form-control" id="exampleInputPassword" %}
                </div>
                <button type="submit" class="btn btn-block text-white" style="background-color: #800517;">Login</button>
            </form>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
