{% extends 'inc/base.html' %}
{% block content %}
<div class="container my-3">
    <div class="d-flex justify-content-end">
        <a href="{% url 'saleList' %}">
            <button type="button" class="btn text-white" style="background-color: #800517">
                <span class="fa fa-backward"></span>
            </button>
        </a>
    </div>
    <br />
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <div class="alert alert-primary" role="alert">{{ message }}</div>
        {% endfor %}
    </ul>
    {% endif %}
    <div class="card">
        <h5 class="card-header text-white" style="background-color: #800517">Add New Sale</h5>
        <div class="card-body">
            <form action={% url "storeSale" %} method="POST">
                    {% csrf_token %}
                <div class="d-flex">
                    <div class="p-2 w-75">
                        <div class="row">
                            <div class="col">
                                <div class="form-group my-2">
                                    <label for="saleNo"><strong>Sale No:</strong></label>
                                    <input type="text" class="form-control" id="saleNo" name="saleNo"/>
                                </div>
                            </div>
                            <div class="col">
                                <div class="form-group my-2">
                                    <label for="centerName"><strong>Sale Date:</strong></label>
                                    <input type="date" class="form-control" id="saleDate" name="saleDate"/>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <div class="form-group my-2">
                                    <label for="customerName"><strong>Customer Name:</strong></label>
                                    <select class="form-select w-75" name="customerName">
                                        {% for customer in customers %}
                                        <option value="{{ customer.id }}">
                                            {{ customer.customerName }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col">
                                <div class="form-group my-2">
                                    <label for="centerName"><strong>Center Name:</strong></label>
                                    <div class="d-flex">
                                        <select class="form-select w-75" name="centerName">
                                            {% for center in centers %}
                                            <option value="{{ center.id }}">
                                                {{ center.centerName }}
                                            </option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group my-2">
                            <label for="note"><strong>Note:</strong></label>
                            <textarea class="form-control" id="note" name="note"></textarea>
                        </div>
                        <br/>
                        <h5 class="" style="color: #800517; font-weight: bold">Sale Products</h5>
                        <div class="row" style="font-size: 12px">
                            <div class="col-2">
                                <label for=""><strong>Product:</strong></label>
                                <select class="form-select w-75" name="productName" id="productName">
                                    <option value="">---Select Product---</option>
                                    {% for product in products %}
                                    <option value="{{ product.id }}">{{ product.productName }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-2">
                                <label for=""><strong>Sale Type:</strong></label>
                                <select class="form-select w-75" name="saleType" id="saleType">
                                    <option value="">---Select Type---</option>
                                    <option value="Online">Online</option>
                                    <option value="Store">Store</option>
                                </select>
                            </div>
                            <div class="col-2">
                                <label for=""><strong>Qty:</strong></label>
                                <input type="number" class="form-control" id="qty" name="qty" onkeyup="calc1()"/>
                            </div>
                            <div class="col-2">
                                <label for=""><strong>Price:</strong></label>
                                <input type="number" class="form-control" id="price" name="price" onkeyup="calc1()"/>
                            </div>
                            <div class="col-2">
                                <label for=""><strong>Amount:</strong></label>
                                <input type="number" class="form-control" id="amount" name="amount" readonly/>
                            </div>
                            <div class="col-2">
                                <input type="button" class="add-row btn btn-primary text-white my-3" value="Add" onclick="add()"/>
                            </div>
                        </div>
                        <br />
                        <table id="tableID" class="table table-bordered">
                            <thead class="text-white" style="background-color: #800517">
                                <th>Product Name</th>
                                <th>Sale Type</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </thead>
                            <tbody></tbody>
                        </table>
                        <br />
                        <button type="submit" class="btn m-2 text-white" style="background-color: #800517">Post</button>
                    </div>
                    <div class="p-2 w-25">
                        <div class="shadow my-4 rounded text-white p-1" style="background-color: #800517; font-size: 14px;">
                            <h6 class="text-center text-white p-2">Vocher</h6>
                                <div class="row">
                                        <div class="col-lg-6"><label>Total Amount:</label></div>
                                        <div class="col-lg-6"><input type="text" id="totalValue" name="amount" value="0" class="form-control my-1" readonly="readonly"></div>
                                </div>
                                <div class="row">
                                        <div class="col-lg-6"><label>Discount:</label></div>
                                        <div class="col-lg-6"><input type="text" id="discount" name="discount" value="0" class="form-control my-1" onkeyup="calc2()"></div>
                                </div>
                                <div class="row">
                                        <div class="col-lg-6"><label>Tax:</label></div>
                                        <div class="col-lg-6"><input type="text" id="tax" name="tax" value="0" class="form-control my-1" onkeyup="calc2()"></div>
                                </div>
                                <div class="row">
                                        <div class="col-lg-6"><label>Balance:</label></div>
                                        <div class="col-lg-6"><input type="text" id="balance" name="balance" value="0" class="form-control my-1" readonly="readonly"></div>
                                </div>
                                <div class="row">
                                        <div class="col-lg-6"><label>Paid:</label></div>
                                        <div class="col-lg-6"><input type="text" id="paid" name="paid" value="0" class="form-control my-1" onkeyup="calc2()"></div>
                                </div>
                                <div class="row">
                                        <div class="col-lg-6"><label for="">Credits:</label></div>
                                        <div class="col-lg-6"><input type="text" id="credit" name="credit" value="0" class="form-control my-1" readonly="readonly"></div>
                                </div>
                        </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
