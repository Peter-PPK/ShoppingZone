{% extends 'inc/base.html' %}{% block content %}
<div class="container my-3">
        <div class="d-flex justify-content-end">
        <a href="{% url 'brandList' %}">
            <button type="button" class="btn text-white" style="background-color: #800517">
                <span class="fa fa-backward"></span>
            </button>
        </a>
    </div><br>
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <div class="alert alert-primary" role="alert">{{ message }}</div>
        {% endfor %}
    </ul>
    {% endif %}
    <div class="card">
        <h5 class="card-header text-white" style="background-color: #800517">Edit Brand</h5>
        <div class="card-body">
            <form action={% url 'editBrand' brand.id %} method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="cityName"><strong>Brand Name</strong></label>
                    <input type="text" class="form-control" id="brandName" name="brandName" value="{{brand.brandName}}">
                </div>
                <button typ="submit" class="btn my-2 text-white" style="background-color: #800517">Update</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
